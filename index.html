<style>
*{box-sizing:border-box}body{margin:0;background:#effcff;color:#214553;font-family:Pretendard,Inter,system-ui,sans-serif}button,select,input,textarea{font:inherit}.brand-title{font-family:'좋은_푸리지아Bold','GF 푸리지아','푸리지아',cursive;font-weight:700;letter-spacing:-.06em}#map{height:430px;border-radius:28px;background:#d9f5fb}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#d9f8fc 0,#f8feff 35%,#fff 100%);box-shadow:0 0 35px #72cbd833}.cloud{background:#fff;border:2px solid #a6e7f0;border-radius:30px;box-shadow:0 8px 20px #65bfc526}.pill{background:#fff;border:1.5px solid #a8e4ec;border-radius:999px;transition:.2s}.pill.active,.nav.active{background:#55cadb;color:#fff;border-color:#55cadb;box-shadow:0 5px 15px #55cadb44}.nav{color:#76a4ae}.hidden{display:none!important}.overlay-label{display:flex;align-items:center;gap:5px;white-space:nowrap}.overlay-dot{width:12px;height:12px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 0 0 3px #ef444455,0 2px 8px #0005}.facility-label{padding:5px 8px;border-radius:9px;background:#fff;color:#214553;font-size:11px;font-weight:700;box-shadow:0 4px 14px #275d6b33}.fab{box-shadow:0 10px 25px #2ab9ce66}.modal-backdrop{background:#124b5b66;backdrop-filter:blur(5px)}

<style>html,body{margin:0;min-height:100%;overflow:hidden}.auth-gate{overflow:hidden}.auth-card{max-height:calc(100vh - 40px);overflow:auto}</style>
<style>.auth-gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#e8fbff,#fff);display:flex;align-items:center;justify-content:center;padding:20px}.auth-card{width:min(100%,420px);background:#fff;border:1px solid #c8eef4;border-radius:28px;padding:24px;box-shadow:0 18px 55px #4bbdce33}.splash-logo{width:88%;max-width:340px;max-height:290px;object-fit:contain;animation:logoIn 1.2s ease both}.splash{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s}.auth-panel{display:none;width:100%;animation:panelIn .45s ease}.auth-panel.show{display:block}.auth-gate.ready .splash{opacity:0;pointer-events:none}.auth-gate.ready .auth-panel.show{display:block}@keyframes logoIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style>
<style>.splash{z-index:2!important;background:radial-gradient(circle at center,#fff 0,#f4fdff 58%,#dff8fc 100%)!important;animation:splashFade 2.6s ease forwards}.splash-logo{width:min(72vw,720px)!important;max-width:none!important;max-height:68vh!important;object-fit:contain;filter:drop-shadow(0 20px 38px #247b8d2e);animation:logoReveal 1.15s cubic-bezier(.2,.8,.2,1) both,logoFloat 2.1s ease-in-out .7s infinite!important}@keyframes logoReveal{from{opacity:0;transform:scale(.78)}70%{opacity:1;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}@keyframes logoFloat{50%{transform:translateY(-10px) scale(1)}}@keyframes splashFade{0%,72%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}@media (prefers-reduced-motion:reduce){.splash,.splash-logo{animation:none!important}.splash{opacity:0;visibility:hidden}}</style></head>
<body><div id="authGate" class="auth-gate"><div class="splash"><img class="splash-logo" src="assets/badaya-logo.png" alt="바다야 놀자 로고"></div><div class="auth-panel show" id="loginPanel"><div class="auth-card"><h2 class="text-2xl font-black text-[#167b8d]">바다야 놀자</h2><p class="text-sm text-[#6e929b] mt-1 mb-5">부산 바다 여행을 시작해보세요.</p><form id="loginForm" class="space-y-3"><input id="loginId" required type="email" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3" placeholder="이메일"><input required type="password" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3" placeholder="비밀번호"><button class="w-full rounded-2xl bg-[#55cadb] text-white font-black py-3">로그인</button></form><button id="showSignup" class="w-full pill py-3 mt-3 font-bold">회원가입</button><button id="guestAccess" class="w-full py-3 mt-2 text-sm font-bold text-[#167b8d] underline underline-offset-4">로그인/회원가입 없이 사용하기</button></div></div><div class="auth-panel" id="signupStep1"><div class="auth-card"><h2 class="text-2xl font-black text-[#167b8d]">회원가입</h2><p class="text-sm text-[#6e929b] mt-1 mb-5">나만의 바다 여행 프로필을 만들어보세요.</p><form id="signupForm" class="space-y-3"><input required id="signupId" type="email" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3" placeholder="이메일"><input required type="password" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3" placeholder="비밀번호"><input required id="nickname" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3" placeholder="닉네임"><button class="w-full rounded-2xl bg-[#55cadb] text-white font-black py-3">회원가입</button></form><button id="backLogin" class="w-full pill py-3 mt-3 font-bold">로그인으로 돌아가기</button></div></div><div class="auth-panel" id="signupStep2"><div class="auth-card"><h2 class="text-2xl font-black text-[#167b8d]">여행 취향 선택</h2><p class="text-sm text-[#6e929b] mt-1 mb-4">좋아하는 항목을 여러 개 골라주세요.</p><div id="preferenceGrid" class="grid grid-cols-2 gap-2"></div><button id="finishSignup" class="w-full rounded-2xl bg-[#55cadb] text-white font-black py-3 mt-5">가입 완료하고 시작하기</button></div></div></div><div class="app relative pb-24">

<main class="px-4 pt-5">
<section id="homePage" class="page"><p class="text-lg font-bold mb-3">나는 지금 <select id="homeRegion" class="pill px-3 py-1 font-bold text-[#167b8d] outline-none"><option>광안리</option><option>해운대</option><option>송정</option><option>다대포</option></select> 바다다!</p><div class="flex gap-2 mb-5"><button class="pill category active flex-1 py-3 font-bold" data-category="food">🍜 맛집</button><button class="pill category flex-1 py-3 font-bold" data-category="stay">🛏️ 숙박</button><button class="pill category flex-1 py-3 font-bold" data-category="activity">🏄 활동</button></div><div class="flex items-end justify-between mb-3"><div><p class="text-xs font-bold text-[#72a8b2]">NAVER RANKING</p><h2 class="text-xl font-black">이 바다의 TOP 3</h2></div><span class="text-xs text-[#86aeb6]">평점순</span></div><div id="placeList" class="space-y-3"></div></section>

</main><nav class="fixed bottom-0 left-0 right-0 z-20 mx-auto max-w-[520px] h-20 bg-white/95 border-t border-[#d9f3f6] flex items-center justify-around"><button class="nav active flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="homePage">🏠<span>홈</span></button><button class="nav flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="mapPage">🗺️<span>지도</span></button><button class="nav flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="communityPage">👥<span>커뮤니티</span></button></nav>

<div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop p-5"><form id="postForm" class="cloud bg-white p-5 mt-20 max-w-[480px] mx-auto"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">새 글 쓰기</h2><button type="button" id="closeModal" class="text-2xl text-[#79aab3]">×</button></div><select id="postType" class="w-full pill px-3 py-3 mb-3 outline-none"><option>EVENT</option><option>잡담</option></select><input id="postTitle" required placeholder="제목을 입력해 주세요" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3 mb-3 outline-none"><textarea id="postBody" required placeholder="바다 이야기를 남겨 주세요" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3 h-28 mb-4 outline-none resize-none"></textarea><button class="w-full rounded-2xl bg-[#55cadb] text-white font-black py-3">등록하기</button></form></div>
<script>
const KAKAO_APP_KEY='aadfcaec662fd9742854769149e0fe10';
// 부산 해수욕장 대표 중심 좌표(해수욕장 전체를 보여주는 지도 기준점)
const regions={광안리:{lat:35.1532,lng:129.1187},해운대:{lat:35.1587,lng:129.1603},송정:{lat:35.1787,lng:129.1990},다대포:{lat:35.0480,lng:128.9661}};
const places={광안리:{food:[['밀락더마켓','4.8','https://search.naver.com/search.naver?query=밀락더마켓'],['수변최고돼지국밥','4.7','https://search.naver.com/search.naver?query=수변최고돼지국밥'],['톤쇼우 광안점','4.6','https://search.naver.com/search.naver?query=톤쇼우 광안점']],stay:[['호텔 아쿠아펠리스','4.7','#'],['켄트호텔 광안리','4.6','#'],['광안리 오션뷰 하우스','4.5','#']],activity:[['광안리 SUP 체험','4.9','#'],['민락수변공원 산책','4.8','#'],['광안리 요트투어','4.7','#']]},해운대:{food:[['금수복국','4.8','#'],['해운대암소갈비집','4.7','#'],['개미집 해운대점','4.6','#']],stay:[['그랜드 조선 부산','4.8','#'],['파라다이스 호텔 부산','4.7','#'],['베스트웨스턴 해운대','4.5','#']],activity:[['해운대 서핑스쿨','4.9','#'],['더베이101 야경','4.8','#'],['동백섬 산책','4.7','#']]},송정:{food:[['수민이네','4.8','#'],['송정집','4.7','#'],['문토스트','4.6','#']],stay:[['송정 오션뷰 호텔','4.7','#'],['브라운도트 송정','4.5','#'],['송정 스테이','4.4','#']],activity:[['송정 서핑 체험','4.9','#'],['죽도공원 산책','4.7','#'],['해변 자전거 투어','4.6','#']]},다대포:{food:[['몰운대 아구찜','4.7','#'],['다대포 횟집거리','4.6','#'],['바다마루','4.5','#']],stay:[['다대포 비치호텔','4.6','#'],['몰운대 게스트하우스','4.4','#'],['다대포 오션스테이','4.3','#']],activity:[['다대포 낙조분수','4.9','#'],['몰운대 트레킹','4.8','#'],['갯벌 생태 체험','4.6','#']]}};
let category='food',posts=[{type:'EVENT',title:'8.24 줍깅 4차멤버 모집',body:'광안리 해변을 함께 걸으며 깨끗하게 만들어요.'},{type:'잡담',title:'지금 바닷가에서 해파리 잡아먹는 사람 봤나요',body:'오늘 바다에서 본 신기한 장면을 공유해요.'},{type:'잡담',title:'오늘의 파도, 생각보다 잔잔하네요',body:'산책하기 딱 좋은 날씨입니다.'}];
function renderPlaces(){const r=document.getElementById('homeRegion').value;const photos={food:['https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=240&q=80'],stay:['https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1601918774946-25832a4be0d6?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=240&q=80'],activity:['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1495954484750-af469f2f9be5?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=240&q=80','https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=240&q=80']};document.getElementById('placeList').innerHTML=places[r][category].map((p,i)=>{const naver=`https://search.naver.com/search.naver?query=${encodeURIComponent(p[0]+' 부산')}`;return `<article class="cloud p-3 flex gap-3"><img src="${photos[category][i%photos[category].length]}" alt="${p[0]} 관련 사진" class="w-20 h-20 rounded-2xl object-cover shrink-0"><div class="min-w-0 flex-1"><h3 class="font-black truncate">${p[0]}</h3><p class="text-sm font-black text-[#f2ae39] mt-1">★ ${p[1]}</p><div class="flex gap-1 mt-2"><a target="_blank" href="${naver}" class="pill px-2 py-1 text-[10px]">네이버 검색</a><a target="_blank" href="https://search.naver.com/search.naver?query=${encodeURIComponent(p[0]+' 전화번호')}" class="pill px-2 py-1 text-[10px]">전화</a><a target="_blank" href="https://search.naver.com/search.naver?query=${encodeURIComponent(p[0]+' 리뷰')}" class="pill px-2 py-1 text-[10px]">리뷰</a></div></div></article>`}).join('')}
function renderPosts(filter='all'){document.getElementById('postList').innerHTML=posts.filter(p=>filter==='all'||p.type===filter).map(p=>`<article class="cloud p-4"><span class="text-xs font-black ${p.type==='EVENT'?'text-[#ef8c63]':'text-[#55aebc]'}">&lt;${p.type}&gt;</span><h3 class="font-black mt-1">${p.title}</h3><p class="text-sm text-[#6e929b] mt-2">${p.body}</p><p class="text-[10px] text-[#a5c3c8] mt-3">방금 전 · 바다친구</p></article>`).join('')}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='mapPage'&&window.map) setTimeout(()=>map.relayout(),50)});
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;renderPlaces()});document.getElementById('homeRegion').onchange=renderPlaces;document.getElementById('mapRegion').onchange=()=>{if(window.map)map.setCenter(new kakao.maps.LatLng(regions[mapRegion.value].lat,regions[mapRegion.value].lng))};document.querySelectorAll('.communityFilter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.communityFilter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPosts(b.dataset.filter)});

let map,markers=[],circles=[];const facilities={trash:[['해변 쓰레기통 1',35.155,129.1195],['해변 쓰레기통 2',35.1548,129.122],['민락수변공원 쓰레기통',35.1528,129.1249]]};function clearMap(){markers.forEach(x=>x.setMap(null));circles.forEach(x=>x.setMap(null));markers=[];circles=[]}function addFacilityMarker(name,lat,lng){const c=`<div class="overlay-label"><span class="overlay-dot"></span><span class="facility-label">${name}</span></div>`;markers.push(new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(lat,lng),content:c,yAnchor:.5}))}function searchKakaoFacilities(type){clearMap();const region=document.getElementById('mapRegion').value;const keyword=type==='parking'?`${region} 주차장`:`${region} 공중화장실`;new kakao.maps.services.Places().keywordSearch(keyword,(result,status)=>{if(status===kakao.maps.services.Status.OK){result.slice(0,15).forEach(x=>addFacilityMarker(x.place_name,Number(x.y),Number(x.x)))}else{addFacilityMarker(`${region} 주변 검색 결과 없음`,regions[region].lat,regions[region].lng)}})}function drawFilter(type){clearMap();if(type==='density'){[['HIGH',35.1538,129.1185,280,'#ef4444'],['MEDIUM',35.1548,129.1215,230,'#facc15'],['LOW',35.1522,129.1245,210,'#34d399']].forEach(x=>circles.push(new kakao.maps.Circle({map,center:new kakao.maps.LatLng(x[1],x[2]),radius:x[3],strokeColor:x[4],strokeOpacity:.55,strokeWeight:1,fillColor:x[4],fillOpacity:.25})));return}if(type==='parking'||type==='toilet'){searchKakaoFacilities(type);return}facilities[type].forEach(x=>addFacilityMarker(x[0],x[1],x[2]))}document.querySelectorAll('.mapFilter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mapFilter').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawFilter(b.dataset.filter)});
