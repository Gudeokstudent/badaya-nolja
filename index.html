<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>바다야 놀자</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Pretendard','Inter','system-ui','sans-serif']},colors:{skybrand:'#bceff8'}}}};</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#effcff;color:#214553;font-family:Pretendard,Inter,system-ui,sans-serif}button,select,input,textarea{font:inherit}#map{height:430px;border-radius:28px;background:#d9f5fb}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#d9f8fc 0,#f8feff 35%,#fff 100%);box-shadow:0 0 35px #72cbd833}.cloud{background:#fff;border:2px solid #a6e7f0;border-radius:30px;box-shadow:0 8px 20px #65bfc526}.pill{background:#fff;border:1.5px solid #a8e4ec;border-radius:999px;transition:.2s}.pill.active,.nav.active{background:#55cadb;color:#fff;border-color:#55cadb;box-shadow:0 5px 15px #55cadb44}.nav{color:#76a4ae}.hidden{display:none!important}.overlay-label{display:flex;align-items:center;gap:5px;white-space:nowrap}.overlay-dot{width:12px;height:12px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 0 0 3px #ef444455,0 2px 8px #0005}.facility-label{padding:5px 8px;border-radius:9px;background:#fff;color:#214553;font-size:11px;font-weight:700;box-shadow:0 4px 14px #275d6b33}.fab{box-shadow:0 10px 25px #2ab9ce66}.modal-backdrop{background:#124b5b66;backdrop-filter:blur(5px)}
</style></head>
<body><div class="app relative pb-24">
<header class="sticky top-0 z-20 flex items-center justify-between px-5 py-4 bg-[#d9f8fc]/90 backdrop-blur border-b border-white"><h1 class="text-2xl font-black tracking-tight text-[#167b8d]">🌊 바다야 놀자</h1><span class="text-xs font-bold text-[#6ca9b4]">오늘도 바다답게</span></header>
<main class="px-4 pt-5">
<section id="homePage" class="page"><p class="text-lg font-bold mb-3">나는 지금 <select id="homeRegion" class="pill px-3 py-1 font-bold text-[#167b8d] outline-none"><option>광안리</option><option>해운대</option><option>송정</option><option>다대포</option></select> 바다다!</p><div class="flex gap-2 mb-5"><button class="pill category active flex-1 py-3 font-bold" data-category="food">🍜 맛집</button><button class="pill category flex-1 py-3 font-bold" data-category="stay">🛏️ 숙박</button><button class="pill category flex-1 py-3 font-bold" data-category="activity">🏄 활동</button></div><div class="flex items-end justify-between mb-3"><div><p class="text-xs font-bold text-[#72a8b2]">NAVER RANKING</p><h2 class="text-xl font-black">이 바다의 TOP 3</h2></div><span class="text-xs text-[#86aeb6]">평점순</span></div><div id="placeList" class="space-y-3"></div></section>
<section id="mapPage" class="page hidden"><p class="text-lg font-bold mb-3">나는 지금 <select id="mapRegion" class="pill px-3 py-1 font-bold text-[#167b8d] outline-none"><option>광안리</option><option>해운대</option><option>송정</option><option>다대포</option></select> 바다다!</p><div class="grid grid-cols-4 gap-2 mb-3"><button class="pill mapFilter py-2 text-xs font-bold" data-filter="toilet">🚻 화장실</button><button class="pill mapFilter py-2 text-xs font-bold" data-filter="parking">🚗 주차장</button><button class="pill mapFilter py-2 text-xs font-bold" data-filter="trash">🗑️ 휴지통</button><button class="pill mapFilter py-2 text-xs font-bold" data-filter="density">👥 인구밀집</button></div><div id="map"></div><div class="cloud mt-3 p-3 flex items-center justify-around text-xs font-bold"><span><i class="inline-block w-3 h-3 rounded-full bg-red-400 mr-1"></i>HIGH</span><span><i class="inline-block w-3 h-3 rounded-full bg-yellow-300 mr-1"></i>MEDIUM</span><span><i class="inline-block w-3 h-3 rounded-full bg-emerald-300 mr-1"></i>LOW</span><span class="text-[#8bb5bd]">5분 자동 갱신</span></div></section>
<section id="communityPage" class="page hidden"><div class="flex gap-2 mb-5"><button class="pill communityFilter active flex-1 py-3 font-bold" data-filter="all">전체</button><button class="pill communityFilter flex-1 py-3 font-bold" data-filter="EVENT">EVENT</button><button class="pill communityFilter flex-1 py-3 font-bold" data-filter="잡담">잡담</button></div><div id="postList" class="space-y-3"></div><button id="openModal" class="fab fixed bottom-24 right-5 sm:right-[calc(50%-235px)] rounded-full bg-[#55cadb] text-white px-5 py-3 font-black z-10">＋ 글쓰기</button></section>
</main><nav class="fixed bottom-0 left-0 right-0 z-20 mx-auto max-w-[520px] h-20 bg-white/95 border-t border-[#d9f3f6] flex items-center justify-around"><button class="nav active flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="homePage">🏠<span>홈</span></button><button class="nav flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="mapPage">🗺️<span>지도</span></button><button class="nav flex flex-col items-center gap-1 text-xs font-bold w-1/3" data-page="communityPage">👥<span>커뮤니티</span></button></nav>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop p-5"><form id="postForm" class="cloud bg-white p-5 mt-20 max-w-[480px] mx-auto"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">새 글 쓰기</h2><button type="button" id="closeModal" class="text-2xl text-[#79aab3]">×</button></div><select id="postType" class="w-full pill px-3 py-3 mb-3 outline-none"><option>EVENT</option><option>잡담</option></select><input id="postTitle" required placeholder="제목을 입력해 주세요" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3 mb-3 outline-none"><textarea id="postBody" required placeholder="바다 이야기를 남겨 주세요" class="w-full rounded-2xl border border-[#b9e7ed] px-4 py-3 h-28 mb-4 outline-none resize-none"></textarea><button class="w-full rounded-2xl bg-[#55cadb] text-white font-black py-3">등록하기</button></form></div>
<script>
const KAKAO_APP_KEY='aadfcaec662fd9742854769149e0fe10';
// 각 지역의 해변 한가운데가 아니라 육지 쪽 주요 시설을 기준으로 잡아
// 확대해도 화면이 바다로 밀리지 않도록 보정한 중심 좌표입니다.
const regions={광안리:{lat:35.1555,lng:129.1185},해운대:{lat:35.1605,lng:129.1630},송정:{lat:35.1805,lng:129.2010},다대포:{lat:35.0485,lng:128.9655}};
const places={광안리:{food:[['밀락더마켓','4.8','https://search.naver.com/search.naver?query=밀락더마켓'],['수변최고돼지국밥','4.7','https://search.naver.com/search.naver?query=수변최고돼지국밥'],['톤쇼우 광안점','4.6','https://search.naver.com/search.naver?query=톤쇼우 광안점']],stay:[['호텔 아쿠아펠리스','4.7','#'],['켄트호텔 광안리','4.6','#'],['광안리 오션뷰 하우스','4.5','#']],activity:[['광안리 SUP 체험','4.9','#'],['민락수변공원 산책','4.8','#'],['광안리 요트투어','4.7','#']]},해운대:{food:[['금수복국','4.8','#'],['해운대암소갈비집','4.7','#'],['개미집 해운대점','4.6','#']],stay:[['그랜드 조선 부산','4.8','#'],['파라다이스 호텔 부산','4.7','#'],['베스트웨스턴 해운대','4.5','#']],activity:[['해운대 서핑스쿨','4.9','#'],['더베이101 야경','4.8','#'],['동백섬 산책','4.7','#']]},송정:{food:[['수민이네','4.8','#'],['송정집','4.7','#'],['문토스트','4.6','#']],stay:[['송정 오션뷰 호텔','4.7','#'],['브라운도트 송정','4.5','#'],['송정 스테이','4.4','#']],activity:[['송정 서핑 체험','4.9','#'],['죽도공원 산책','4.7','#'],['해변 자전거 투어','4.6','#']]},다대포:{food:[['몰운대 아구찜','4.7','#'],['다대포 횟집거리','4.6','#'],['바다마루','4.5','#']],stay:[['다대포 비치호텔','4.6','#'],['몰운대 게스트하우스','4.4','#'],['다대포 오션스테이','4.3','#']],activity:[['다대포 낙조분수','4.9','#'],['몰운대 트레킹','4.8','#'],['갯벌 생태 체험','4.6','#']]}};
let category='food',posts=[{type:'EVENT',title:'8.24 줍깅 4차멤버 모집',body:'광안리 해변을 함께 걸으며 깨끗하게 만들어요.'},{type:'잡담',title:'지금 바닷가에서 해파리 잡아먹는 사람 봤나요',body:'오늘 바다에서 본 신기한 장면을 공유해요.'},{type:'잡담',title:'오늘의 파도, 생각보다 잔잔하네요',body:'산책하기 딱 좋은 날씨입니다.'}];
function renderPlaces(){const r=document.getElementById('homeRegion').value;document.getElementById('placeList').innerHTML=places[r][category].map((p,i)=>`<article class="cloud p-3 flex gap-3"><div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-[#8edce8] to-[#e7fbfd] grid place-items-center text-3xl shrink-0">${['🍽️','🌊','☀️'][i]}</div><div class="min-w-0 flex-1"><h3 class="font-black truncate">${p[0]}</h3><p class="text-sm font-black text-[#f2ae39] mt-1">★ ${p[1]}</p><div class="flex gap-1 mt-2"><a target="_blank" href="${p[2]}" class="pill px-2 py-1 text-[10px]">예약</a><a target="_blank" href="https://search.naver.com/search.naver?query=${encodeURIComponent(p[0]+' 전화번호')}" class="pill px-2 py-1 text-[10px]">전화</a><a target="_blank" href="https://search.naver.com/search.naver?query=${encodeURIComponent(p[0]+' 리뷰')}" class="pill px-2 py-1 text-[10px]">리뷰</a></div></div></article>`).join('')}
function renderPosts(filter='all'){document.getElementById('postList').innerHTML=posts.filter(p=>filter==='all'||p.type===filter).map(p=>`<article class="cloud p-4"><span class="text-xs font-black ${p.type==='EVENT'?'text-[#ef8c63]':'text-[#55aebc]'}">&lt;${p.type}&gt;</span><h3 class="font-black mt-1">${p.title}</h3><p class="text-sm text-[#6e929b] mt-2">${p.body}</p><p class="text-[10px] text-[#a5c3c8] mt-3">방금 전 · 바다친구</p></article>`).join('')}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='mapPage'&&window.map) setTimeout(()=>map.relayout(),50)});
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;renderPlaces()});document.getElementById('homeRegion').onchange=renderPlaces;document.getElementById('mapRegion').onchange=()=>{if(window.map)map.setCenter(new kakao.maps.LatLng(regions[mapRegion.value].lat,regions[mapRegion.value].lng))};document.querySelectorAll('.communityFilter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.communityFilter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPosts(b.dataset.filter)});
const modal=document.getElementById('modal');document.getElementById('openModal').onclick=()=>modal.classList.remove('hidden');document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('postForm').onsubmit=e=>{e.preventDefault();posts.unshift({type:postType.value,title:postTitle.value,body:postBody.value});renderPosts();e.target.reset();modal.classList.add('hidden')};renderPlaces();renderPosts();
let map,markers=[],circles=[];const facilities={toilet:[['광안리 해변 화장실',35.1561,129.1194],['민락수변공원 화장실',35.153,129.124],['민락항 화장실',35.1512,129.1268]],parking:[['광안리 공영주차장',35.1534,129.1187],['민락매립지 주차장',35.152,129.126],['수영구청 부설주차장',35.1555,129.1157]],trash:[['해변 쓰레기통 1',35.155,129.1195],['해변 쓰레기통 2',35.1548,129.122],['민락수변공원 쓰레기통',35.1528,129.1249]]};function clearMap(){markers.forEach(x=>x.setMap(null));circles.forEach(x=>x.setMap(null));markers=[];circles=[]}function drawFilter(type){clearMap();if(type==='density'){[['HIGH',35.1538,129.1185,280,'#ef4444'],['MEDIUM',35.1548,129.1215,230,'#facc15'],['LOW',35.1522,129.1245,210,'#34d399']].forEach(x=>circles.push(new kakao.maps.Circle({map,center:new kakao.maps.LatLng(x[1],x[2]),radius:x[3],strokeColor:x[4],strokeOpacity:.55,strokeWeight:1,fillColor:x[4],fillOpacity:.25})));return}facilities[type].forEach(x=>{const c=`<div class="overlay-label"><span class="overlay-dot"></span><span class="facility-label">${x[0]}</span></div>`;markers.push(new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(x[1],x[2]),content:c,yAnchor:.5}))})}document.querySelectorAll('.mapFilter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mapFilter').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawFilter(b.dataset.filter)});
const s=document.createElement('script');s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&autoload=false`;s.onload=()=>kakao.maps.load(()=>{map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(regions.광안리.lat,regions.광안리.lng),level:4});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);map.addControl(new kakao.maps.MapTypeControl(),kakao.maps.ControlPosition.TOPRIGHT);});document.head.appendChild(s);
</script></body></html>
